# nginx in the frontend container: the built React app, and /api/* forwarded to the API (what Vite's dev proxy does
# when running locally). The browser only ever talks to this one origin, so the API needs no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads up to RAG_MAX_FILE_MB (25 MB) plus form overhead.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # The REAL client address for the API's per-client rate limits. Overwritten, never appended: a client can't
        # pretend to be someone else by sending its own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat answer can take up to ORCH_TURN_TIMEOUT_SECONDS (120 s); an email approval resumes the run.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Client-side routes (/c/<chat id>) are the React app too.
    location / {
        try_files $uri /index.html;
    }
}
