[project]
name = "orchestrator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.150.0",
    "fastapi>=0.162.4",
    "fastembed>=0.9.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.33",
    "sqlglot>=30.29.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # run `async def test_...` functions without decorating each one
# Slow tests (real Docling parsing, ~1 min) are skipped by default; run them with: uv run pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "integration: needs the local Postgres from docker-compose (skipped when unavailable)",
    "slow: runs real models (Docling parsing); takes seconds to minutes",
]

# --- CPU-only PyTorch (Docling needs torch; this machine has no GPU) ---
# PyPI's Linux torch wheels bundle several GB of NVIDIA CUDA libraries. PyTorch publishes
# CPU-only builds on its own index. `explicit = true` means ONLY packages listed under
# [tool.uv.sources] come from that index; everything else still comes from PyPI.
# Sources only apply to DIRECT dependencies, which is why torch and torchvision are
# listed in [project.dependencies] even though only Docling uses them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
