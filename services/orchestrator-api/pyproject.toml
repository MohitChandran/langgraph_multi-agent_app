[project]
name = "orchestrator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.1",
    "sqlglot>=30.29.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # run `async def test_...` functions without decorating each one
markers = ["integration: needs the local Postgres from docker-compose (skipped when unavailable)"]
