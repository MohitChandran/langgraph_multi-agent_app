[project]
name = "email-a2a-service"
version = "0.1.0"
description = "Email agent (CrewAI) behind an A2A server, with human approval before anything is sent (plan 05)."
requires-python = ">=3.12,<3.14"  # CrewAI supports Python < 3.14
dependencies = [
    "a2a-sdk[fastapi,postgresql]==1.3.1",
    "aiosmtplib==5.1.3",
    "crewai==1.15.44",
    "langfuse>=5",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # run `async def test_...` functions without decorating each one
asyncio_default_fixture_loop_scope = "function"
# Network tests (a real CrewAI crew on Groq) are skipped by default; run them with: uv run pytest -m network
addopts = "-m 'not network'"
# CrewAI's own internal deprecation notices (not about our code): keep the test output readable.
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
markers = [
    "integration: needs the local Postgres / Mailpit from docker-compose (skipped when unavailable)",
    "network: calls Groq; costs tokens",
]
